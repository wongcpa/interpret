<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Translate</title>
<meta name="theme-color" content="#0F2A3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Translate">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* wong.cpa brand: slate, gold and paper; dark mode is a slate variant */
:root{--bg:#F6F6F4;--card:#fff;--text:#0d0d0d;--muted:#6b7280;--line:#d1cdc4;--accent:#0F2A3D;--accent-bg:#f5f0e8;--on-accent:#fff;--gold:#7A5F2C;--gold-hi:#C9A45C;--rec:#b91c1c;--rec-bg:#fef2f2;--warn:#7A5F2C;--warn-bg:#f5f0e8;--mono:"IBM Plex Mono",ui-monospace,monospace;--head:"Sora",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0a1823;--card:#0F2A3D;--text:#eef1f4;--muted:#9fb0bf;--line:#24425a;--accent:#C9A45C;--accent-bg:#17364d;--on-accent:#0F2A3D;--gold:#C9A45C;--gold-hi:#C9A45C;--rec:#ff7b70;--rec-bg:#3a1d1b;--warn:#e6c47e;--warn-bg:#17364d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","PingFang HK","Noto Sans CJK TC",sans-serif}
h1,h2,h3{font-family:var(--head)}
.wb-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#0F2A3D;margin:calc(-10px - env(safe-area-inset-top)) -16px 14px;padding:calc(env(safe-area-inset-top) + 9px) 16px 9px}
.wb-brand{display:inline-flex;align-items:center;gap:8px;color:#fff;text-decoration:none;font-family:var(--head);font-weight:600;font-size:15px}
.wb-brand svg{width:24px;height:24px;border-radius:4px}
.wb-back{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#C9A45C;text-decoration:none}
@media (display-mode:standalone){.wb-bar{display:none}}
.standalone .wb-bar{display:none}
body{padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 20px)}
button{font:inherit;color:inherit;cursor:pointer}
svg{width:24px;height:24px;flex:none}
.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between}
h1{font-size:20px;font-weight:600;margin:0}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.voice-row{display:flex;align-items:center;gap:8px;margin-top:12px}
.voice-row select{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0 10px;font:inherit;font-size:16px}
.voice-lbl{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.voice-hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.lang-btn{width:100%;min-height:56px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:left;padding:8px 12px;display:flex;align-items:center;gap:8px}
.lang-btn .names{flex:1;min-width:0}
.en{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nat{display:block;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang-btn svg{color:var(--muted);width:20px;height:20px}
.swap-row{display:flex;justify-content:center;margin:8px 0}
.swap{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;padding:0}
.rec-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0 2px}
.rec{width:124px;height:124px;border-radius:50%;border:3px solid var(--accent);background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;padding:0;box-shadow:0 0 0 5px var(--bg),0 0 0 7px var(--gold-hi)}
.rec svg{width:44px;height:44px}
.rec.recording{background:var(--rec);border-color:var(--rec);color:#fff;animation:pulse 1.3s infinite}
.rec.busy{border-color:var(--line);background:var(--bg);color:var(--muted)}
.rec.busy svg{animation:spin 1s linear infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,48,37,.45)}70%{box-shadow:0 0 0 20px rgba(217,48,37,0)}100%{box-shadow:0 0 0 0 rgba(217,48,37,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.status{font-size:15px;color:var(--muted);min-height:24px;text-align:center}
.play{width:100%;height:66px;border-radius:16px;border:2px dashed var(--line);background:transparent;color:var(--muted);font-size:19px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px}
.play.ready{border:2px solid var(--accent);background:var(--accent);color:var(--on-accent)}
.play.ready.flashy{animation:glow 1s 2}
@keyframes glow{50%{transform:scale(1.03)}}
.out .k{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.heard{color:var(--muted);margin:2px 0 12px;word-break:break-word;white-space:pre-wrap}
.translation{font-size:23px;font-weight:600;margin:2px 0 0;word-break:break-word;white-space:pre-wrap;line-height:1.4}
.note,.error{border-radius:12px;padding:10px 12px;font-size:14px}
.note{background:var(--warn-bg);color:var(--warn)}
.error{background:var(--rec-bg);color:var(--rec)}
.error button,.note button{margin-top:8px;border:1px solid currentColor;background:transparent;border-radius:10px;padding:6px 12px;font-size:14px}
.error details,.note details{margin-top:6px;font-size:12px;opacity:.85;word-break:break-word}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 10px)}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;max-width:480px;width:100%;margin-left:auto;margin-right:auto}
.sheet-head h2{flex:1;font-size:18px;margin:0}
.search{width:100%;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:0 14px;font-size:17px}
.list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;max-width:480px;width:100%;margin:10px auto 0}
.item{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 6px;display:flex;align-items:center;gap:10px;min-height:56px}
.item .names{flex:1;min-width:0}
.item.sel{background:var(--accent-bg)}
.item svg{color:var(--accent);width:20px;height:20px}
.empty{color:var(--muted);text-align:center;padding:24px 0}
.settings{flex:1;overflow-y:auto;max-width:480px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.settings label{font-weight:600;display:block;margin-bottom:6px}
.settings p{margin:0;font-size:14px;color:var(--muted)}
.row{display:flex;gap:8px}
.field{flex:1;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:0 12px;font-size:16px;min-width:0}
.btn{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 16px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.field.area{height:auto;min-height:72px;width:100%;padding:10px 12px;resize:vertical;font:inherit;font-size:16px}
.note strong{font-weight:600}
.note .actions{display:flex;flex-wrap:wrap;gap:8px}
.radio{display:flex;align-items:flex-start;gap:10px;padding:10px 0;font-weight:400!important}
.radio input{width:20px;height:20px;margin-top:2px}
.radio small{display:block;color:var(--muted);font-size:13px}
input[type=range]{width:100%}
a{color:var(--accent)}
.hidden{display:none!important}
.type-row{display:flex;gap:8px;align-items:stretch}
.type-box{flex:1;min-height:52px}
.type-row .btn{height:auto;min-height:52px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="wb-bar">
  <a class="wb-brand" href="https://www.wong.cpa/"><svg viewBox="0 0 200 200" aria-hidden="true"><rect width="200" height="200" rx="14" fill="#0F2A3D"/><polyline points="45,96 75,140 111,60" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="square"/><polyline points="89,96 119,140 155,60" fill="none" stroke="#C9A45C" stroke-width="12" stroke-linecap="square"/></svg><span>Jimmy Wong, CPA</span></a>
  <a class="wb-back" href="https://www.wong.cpa/#projects">&larr; All tools</a>
</div>
<div class="app">
  <header>
    <h1 data-i18n="title">Translate</h1>
    <button class="icon-btn" id="settingsBtn" data-i18n-aria="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>

  <div class="card">
    <p class="lbl" data-i18n="from">From</p>
    <button class="lang-btn" id="fromBtn"><span class="names"><span class="en" id="fromEn"></span><span class="nat" id="fromNat"></span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <div class="swap-row"><button class="swap" id="swapBtn" data-i18n-aria="swap" aria-label="Swap languages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg></button></div>
    <p class="lbl" data-i18n="to">To</p>
    <button class="lang-btn" id="toBtn"><span class="names"><span class="en" id="toEn"></span><span class="nat" id="toNat"></span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <div class="voice-row">
      <span class="voice-lbl" data-i18n="voice">Voice</span>
      <select id="voiceSel" data-i18n-aria="voiceAria" aria-label="Voice for the translation"></select>
      <button class="icon-btn" id="previewBtn" data-i18n-aria="preview" aria-label="Preview voice"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.4-6.5a1 1 0 0 0 0-1.8L9.5 4.6A1 1 0 0 0 8 5.5z"/></svg></button>
    </div>
    <p class="voice-hint" id="voiceHint"></p>
  </div>

  <div id="demoBox" class="note hidden"><span data-i18n-html="demoHtml"></span>
    <div class="actions"><button id="demoKeyGuide" data-i18n="howKey">How to get a key</button><button id="demoEnterKey" data-i18n="enterKey">Enter a key</button></div>
  </div>

  <div class="rec-wrap">
    <button class="rec" id="recBtn" aria-label="Record"></button>
    <div class="status" id="status" aria-live="polite" data-i18n="tapToRecord">Tap to record, tap again to stop</div>
  </div>

  <div class="type-row">
    <textarea class="field area type-box" id="typeInput" rows="2" maxlength="2000" data-i18n-ph="typePh" data-i18n-aria="typePh" placeholder="Or type something to translate"></textarea>
    <button class="btn primary" id="typeBtn" data-i18n="typeBtn">Translate</button>
  </div>

  <button class="play" id="playBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.4-6.5a1 1 0 0 0 0-1.8L9.5 4.6A1 1 0 0 0 8 5.5z"/></svg><span id="playLabel" data-i18n="play">Play translation</span></button>

  <div id="errorBox" class="error hidden" role="alert"></div>
  <div id="noteBox" class="note hidden"></div>

  <div class="card out hidden" id="outCard">
    <p class="k" id="heardLbl" data-i18n="heard">Heard</p>
    <p class="heard" id="heardText"></p>
    <p class="k" data-i18n="translation">Translation</p>
    <p class="translation" id="transText"></p>
  </div>
</div>

<div class="sheet hidden" id="picker" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
  <div class="sheet-head">
    <h2 id="pickerTitle" data-i18n="chooseLang">Choose language</h2>
    <button class="icon-btn" id="pickerClose" data-i18n-aria="close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div style="max-width:480px;width:100%;margin:0 auto">
    <input class="search" id="search" type="search" data-i18n-ph="searchPh" data-i18n-aria="searchAria" placeholder="Type a language (English or native)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Search languages">
  </div>
  <div class="list" id="list" role="listbox"></div>
</div>

<div class="sheet hidden" id="settings" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
  <div class="sheet-head">
    <h2 id="settingsTitle" data-i18n="settings">Settings</h2>
    <button class="icon-btn" id="settingsClose" data-i18n-aria="close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="settings">
    <div id="firstRun" class="note hidden" data-i18n="firstRun">Paste a Gemini API key to start. You only need to do this once on this phone.</div>
    <div class="card">
      <label for="uiLang" data-i18n="uiLang">App language</label>
      <select class="field" id="uiLang" style="width:100%"><option value="en">English</option><option value="zh">简体中文</option><option value="zht">繁體中文</option><option value="ja">日本語</option><option value="es">Español</option><option value="it">Italiano</option><option value="fr">Français</option></select>
    </div>
    <div class="card">
      <label for="keyInput" data-i18n="keyLabel">Gemini API key</label>
      <div class="row">
        <input class="field" id="keyInput" type="password" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-i18n-ph="keyPh" placeholder="Paste key here">
        <button class="btn" id="keyShow" type="button" data-i18n="show">Show</button>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="btn primary" id="keySave" style="flex:1" data-i18n="saveKey">Save key</button>
        <button class="btn" id="keyTest" data-i18n="test">Test</button>
      </div>
      <p id="keyMsg" style="margin-top:8px"></p>
      <p style="margin-top:8px" data-i18n-html="keySavedHtml"></p>
      <p style="margin-top:8px" data-i18n="freeNote"></p>
    </div>
    <div class="card">
      <label for="rate"><span data-i18n="speed">Speaking speed</span> <span id="rateOut" style="font-weight:400;color:var(--muted)"></span></label>
      <input id="rate" type="range" min="0.6" max="1.3" step="0.05">
      <p style="margin-top:6px" data-i18n-html="speedNoteHtml"></p>
    </div>
    <div class="card">
      <details>
        <summary style="font-weight:600" data-i18n="advanced">Advanced</summary>
        <label for="modelInput" style="margin-top:10px" data-i18n="model">Translation model</label>
        <input class="field" id="modelInput" style="width:100%" autocomplete="off" autocapitalize="off" spellcheck="false">
        <p style="margin-top:6px" data-i18n="modelNote"></p>
        <label for="styleInput" style="margin-top:16px" data-i18n="style">Voice style (Gemini)</label>
        <textarea class="field area" id="styleInput" maxlength="200" data-i18n-ph="stylePh" autocapitalize="sentences"></textarea>
        <p style="margin-top:6px" data-i18n="styleNote"></p>
        <button class="btn" id="keyRemove" style="margin-top:12px" data-i18n="removeKey">Remove saved key</button>
      </details>
    </div>
  </div>
</div>

<audio id="player" playsinline preload="auto"></audio>

<script>
'use strict';
const API = 'https://generativelanguage.googleapis.com/v1beta/';
const DEFAULT_MODEL = 'gemini-3.5-flash-lite';
const FALLBACK_MODELS = ['gemini-3.1-flash-lite', 'gemini-2.5-flash-lite'];
const TTS_LITE = 'gemini-3.8-flash-lite-tts';
const TTS_FULL = 'gemini-3.8-flash-tts';
const MAX_SECONDS = 60;

/* Gemini's prebuilt voices with Google's one-word description of each */
const GEMINI_VOICES = [['Achernar','Soft'],['Achird','Friendly'],['Algenib','Gravelly'],['Algieba','Smooth'],['Alnilam','Firm'],
  ['Aoede','Breezy'],['Autonoe','Bright'],['Callirrhoe','Easy-going'],['Charon','Informative'],['Despina','Smooth'],
  ['Enceladus','Breathy'],['Erinome','Clear'],['Fenrir','Excitable'],['Gacrux','Mature'],['Iapetus','Clear'],
  ['Kore','Firm'],['Laomedeia','Upbeat'],['Leda','Youthful'],['Orus','Firm'],['Puck','Upbeat'],

/* Demo mode (no key): one sample sentence per language, played with phone voices only */
const DEMO = {
  'en': 'Excuse me, how do I get to the train station?',
  'yue-HK': '唔該，請問火車站點去呀？',
  'es-ES': 'Perdona, ¿cómo llego a la estación de tren?',

  'pt-PT': 'Desculpe, como chego à estação de comboios?'

/* [id, English name, native name, phone-voice codes, flags (s = exact voice only, F = needs full Gemini TTS), extra search words] */
const RAW = [
['af','Afrikaans','Afrikaans','af-ZA'],
['ak','Akan (Twi)','Akan','ak','','twi'],
['sq','Albanian','Shqip','sq-AL','F'],
['am','Amharic','አማርኛ','am-ET'],
['ar','Arabic (Standard)','العربية','ar-SA,ar-001,ar','','msa fusha'],
['ar-EG','Arabic (Egyptian)','العربية المصرية','ar-EG','','egypt masri'],
['hy','Armenian','Հայերեն','hy-AM'],
['as','Assamese','অসমীয়া','as-IN'],
['az','Azerbaijani','Azərbaycanca','az-AZ'],
['eu','Basque','Euskara','eu-ES'],
['be','Belarusian','Беларуская','be-BY'],
['bn','Bengali','বাংলা','bn-BD,bn-IN','','bangla'],
['bho','Bhojpuri','भोजपुरी','bho-IN,bho'],
['bs','Bosnian','Bosanski','bs-BA'],

};

const HTML_LANG = { en: 'en', zh: 'zh-Hans', zht: 'zh-Hant', ja: 'ja', es: 'es-ES', it: 'it', fr: 'fr' };
function phoneUiLang() {
  for (const l of navigator.languages || [navigator.language || 'en']) {
    const c = (l || '').toLowerCase();
    if (/^zh-(tw|hk|mo)|^zh-hant/.test(c)) return 'zht';
    if (c.startsWith('zh')) return 'zh';
    if (STR[c.split('-')[0]]) return c.split('-')[0];
  }
  return 'en';
}
let UI = STR[store.get('gt_ui_lang', '')] ? store.get('gt_ui_lang', '') : phoneUiLang();
const tx = (k, v = {}) => String((STR[UI] && STR[UI][k]) || STR.en[k] || k).replace(/\{(\w+)\}/g, (m, n) => (n in v ? v[n] : m));
const langName = l => UI === 'en' ? l.en : l.nat;
function applyStatic() {
  document.documentElement.lang = HTML_LANG[UI];
  document.title = tx('title');
  const vars = { lang: UI, to: tx('to') };
  document.querySelectorAll('[data-i18n]').forEach(n => { n.textContent = tx(n.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(n => { n.innerHTML = tx(n.dataset.i18nHtml, vars); });
  document.querySelectorAll('[data-i18n-ph]').forEach(n => { n.placeholder = tx(n.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-aria]').forEach(n => { n.setAttribute('aria-label', tx(n.dataset.i18nAria)); });
  AUTO.en = tx('autoEn'); AUTO.nat = tx('autoNat');
}

/* ---------- language picker ---------- */
let pickFor = null;
function openPicker(which) {
  pickFor = which;
  $('#pickerTitle').textContent = which === 'from' ? tx('translateFrom') : tx('translateTo');
  const s = $('#search'); s.value = '';
  renderList('');
  $('#picker').classList.remove('hidden');
  s.focus();
}
function closePicker() { $('#picker').classList.add('hidden'); pickFor = null; }
function renderList(q) {
  const cur = pickFor === 'from' ? S.from : S.to;
  let items = pickFor === 'from' ? [AUTO, ...LANGS] : LANGS.slice();
  const terms = fold(q).trim().split(/\s+/).filter(Boolean);
  if (terms.length) {
    items = items.filter(l => terms.every(t => l.hay.includes(t)));
    const first = terms[0];
    const rank = l => (fold(l.en).startsWith(first) || fold(l.nat).startsWith(first)) ? 0 : 1;
    items.sort((a, b) => rank(a) - rank(b) || a.en.localeCompare(b.en, 'en'));
  }
  const list = $('#list');
  if (!items.length) { list.innerHTML = '<div class="empty">' + esc(tx('noMatch')) + '</div>'; return; }
  list.innerHTML = items.map(l =>
    `<button class="item${l.id === cur ? ' sel' : ''}" data-id="${l.id}" role="option" aria-selected="${l.id === cur}"><span class="names"><span class="en">${esc(l.en)}</span><span class="nat">${esc(l.nat)}</span></span>${l.id === cur ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>' : ''}</button>`
  ).join('');
}
$('#list').addEventListener('click', e => {
  const b = e.target.closest('.item'); if (!b) return;
  const id = b.dataset.id;
  if (pickFor === 'from') S.from = id; else S.to = id;
  renderLangs(); closePicker();
});
$('#search').addEventListener('input', e => renderList(e.target.value));
$('#search').addEventListener('keydown', e => { if (e.key === 'Enter') { const f = $('#list .item'); if (f) f.click(); } });
$('#pickerClose').onclick = closePicker;
$('#fromBtn').onclick = () => openPicker('from');
$('#toBtn').onclick = () => openPicker('to');

function matchDetected(code) {
  const c = fold(code).replace(/_/g, '-'); if (!c) return null;
  if (/^(yue|zh-hk)/.test(c)) return byId('yue-HK');
  if (/^zh-(tw|hant)|^cmn-hant/.test(c)) return byId('zh-TW');
  if (/^(zh|cmn)/.test(c)) return byId('zh-CN');
  return LANGS.find(l => fold(l.id) === c) ||
    LANGS.find(l => l.speech.some(s => fold(s) === c)) ||
    LANGS.find(l => fold(l.id).split('-')[0] === c.split('-')[0]) || null;
}
$('#swapBtn').onclick = () => {
  let newTo = S.from;
  if (S.from === 'auto') {
    const d = matchDetected(S.detected);
    if (!d) { setStatus(tx('pickFromFirst', { from: tx('from') })); return; }
    newTo = d.id;
  }
  S.from = S.to; S.to = newTo;
  renderLangs();
};

function mkErr(status, userMsg, raw) { const e = new Error(userMsg); e.status = status; e.userMsg = userMsg; e.raw = raw || ''; return e; }

  if (/referer|referrer/i.test(m)) return tx('errKeyBlocked');
  if (status === 401 || status === 403) return tx('errNoAccess');
  if (status === 429) return tx('errQuota');
  if (status === 404) return tx('errModel');
  if (status >= 500) return tx('errBusy');
  if (status === 400) return tx('errBadReq');
  return tx('errGeneric');
}
// Errors carry a kind so behaviour doesn't depend on (translated) message wording.
const keyProblem = (status, msg) => status === 401 || status === 403 || /API[_ ]?key[_ ]?(not valid|invalid)|API_KEY_INVALID|referer|referrer/i.test(msg || '');

    previewPlayer.src = previewCache[k]; previewPlayer.playbackRate = rate();
    await previewPlayer.play();
  } catch (e) { setStatus(''); showError(e.userMsg || tx('previewFail'), { detail: e.raw }); }
};

el.player.addEventListener('playing', () => { el.playLabel.textContent = tx('playing'); });
el.player.addEventListener('ended', () => { el.playLabel.textContent = tx('playAgain'); });
el.player.addEventListener('pause', () => { if (!el.player.ended) el.playLabel.textContent = tx('play'); });

/* ---------- init ---------- */
/* ---------- typed text ---------- */
$('#typeBtn').onclick = () => {
  const text = $('#typeInput').value.trim();
  if (S.busy || S.rec) return;
  if (!text) { setStatus(tx('typeFirst')); return; }
  if (!getKey()) {
    clearError();
    showNote(esc(tx('typeNeedsKey')) + '<div class="actions"><button id="typeGuide">' + esc(tx('howKey')) + '</button><button id="typeKey">' + esc(tx('enterKey')) + '</button></div>');
    $('#typeGuide').onclick = () => { location.href = 'key-guide.html?lang=' + UI; };
    $('#typeKey').onclick = () => openSettings(true);
    return;
  }
  clearNote(); resetOutput(); $('#typeInput').blur();
  S.lastInput = { text }; translate(S.lastInput);
};

/* ---------- interface language switch ---------- */
$('#uiLang').onchange = e => {
  UI = e.target.value; store.set('gt_ui_lang', UI);
  applyStatic(); renderLangs(); renderRec();
  el.playLabel.textContent = tx('play');
  if (S.result) $('#heardLbl').textContent = tx(S.lastInput && S.lastInput.text ? 'typed' : 'heard');
  if (!S.busy && !S.rec) setStatus(tx('tapToRecord'));
};

if (navigator.standalone) document.documentElement.classList.add('standalone'); // iOS home-screen launch
applyStatic(); renderLangs(); renderRec(); renderDemo(); loadVoices().then(renderVoices);
</script>
</body>
</html>
