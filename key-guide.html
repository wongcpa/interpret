<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gemini Key Guide</title>
<meta name="theme-color" content="#0F2A3D">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F6F4;--card:#fff;--text:#0d0d0d;--muted:#6b7280;--line:#d1cdc4;--accent:#0F2A3D;--accent-bg:#f5f0e8;--on-accent:#fff;--gold:#7A5F2C;--mono:"IBM Plex Mono",ui-monospace,monospace;--head:"Sora",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0a1823;--card:#0F2A3D;--text:#eef1f4;--muted:#9fb0bf;--line:#24425a;--accent:#C9A45C;--accent-bg:#17364d;--on-accent:#0F2A3D;--gold:#C9A45C}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 "IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","PingFang HK","Hiragino Sans","Noto Sans CJK TC",sans-serif}
body{padding:0 16px calc(env(safe-area-inset-bottom) + 28px)}
.wb-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#0F2A3D;margin:0 -16px 18px;padding:calc(env(safe-area-inset-top) + 9px) 16px 9px}
.wb-brand{display:inline-flex;align-items:center;gap:8px;color:#fff;text-decoration:none;font-family:var(--head);font-weight:600;font-size:15px}
.wb-brand svg{width:24px;height:24px;border-radius:4px}
.wb-back{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#C9A45C;text-decoration:none}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.langs{display:flex;flex-wrap:wrap;gap:6px}
.langs button{font-family:var(--mono);font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:3px;background:var(--card);color:var(--muted);cursor:pointer}
.langs button.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
h1{font-family:var(--head);font-size:26px;line-height:1.25;margin:4px 0 0;color:var(--text)}
.intro{color:var(--muted);margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 18px 14px}
.card h2{font-family:var(--head);font-size:18px;margin:0 0 10px}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:0 0 4px}
ol,ul{margin:0;padding-left:22px}
li{margin:0 0 8px}
.note{background:var(--accent-bg);border-left:3px solid var(--gold);padding:10px 12px;border-radius:0 8px 8px 0;font-size:14px;margin-top:10px}
a{color:var(--gold)}
.back{display:inline-block;margin-top:4px;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<div class="wb-bar">
  <a class="wb-brand" href="https://www.wong.cpa/"><svg viewBox="0 0 200 200" aria-hidden="true"><rect width="200" height="200" rx="14" fill="#0F2A3D"/><polyline points="45,96 75,140 111,60" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="square"/><polyline points="89,96 119,140 155,60" fill="none" stroke="#C9A45C" stroke-width="12" stroke-linecap="square"/></svg><span>Jimmy Wong, CPA</span></a>
  <a class="wb-back" href="https://www.wong.cpa/#projects">&larr; All tools</a>
</div>
<main>
  <div class="langs" id="langs" role="group" aria-label="Language"></div>
  <h1 id="title"></h1>
  <p class="intro" id="intro"></p>
  <section class="card"><p class="tag">1</p><h2 id="s1"></h2><ol id="s1l"></ol></section>
  <section class="card"><p class="tag">2</p><h2 id="s2"></h2><ol id="s2l"></ol><div class="note" id="s2n"></div></section>
  <section class="card"><p class="tag">3</p><h2 id="s3"></h2><ul id="s3l"></ul></section>
  <a class="back" id="back" href="./"></a>
</main>

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fill = s => esc(s).replace('{app}', APP).replace('{studio}', STUDIO);

function phoneLang() {
  for (const l of navigator.languages || [navigator.language || 'en']) {
    const c = (l || '').toLowerCase();
    if (/^zh-(tw|hk|mo)|^zh-hant/.test(c)) return 'zht';
    if (c.startsWith('zh')) return 'zh';
    const base = c.split('-')[0];
    if (T[base]) return base;
  }
  return 'en';
}
function render(lang) {
  const t = T[lang];
  document.documentElement.lang = HTML_LANG[lang];
  document.getElementById('title').textContent = t.title;
  document.getElementById('intro').textContent = t.intro;
  ['s1', 's2', 's3'].forEach(k => {
    document.getElementById(k).textContent = t[k];
    document.getElementById(k + 'l').innerHTML = t[k + 'l'].map(x => '<li>' + fill(x) + '</li>').join('');
  });
  document.getElementById('s2n').textContent = t.s2n;
  document.getElementById('back').textContent = t.back;
  document.querySelectorAll('#langs button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  store.set('gt_guide_lang', lang);
}
document.getElementById('langs').innerHTML = LANGS.map(([id, label]) => `<button data-lang="${id}" lang="${HTML_LANG[id]}">${label}</button>`).join('');
document.getElementById('langs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) render(b.dataset.lang); });
const asked = new URLSearchParams(location.search).get('lang');
render(T[asked] ? asked : (T[store.get('gt_guide_lang')] ? store.get('gt_guide_lang') : phoneLang()));
</script>
